<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed square for Android adaptive icons / iOS.
       Artwork is shrunk to stay inside the central "safe zone" so it is never cropped. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF5EC"/>
      <stop offset="100%" stop-color="#F5EDE2"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0607A"/>
      <stop offset="50%" stop-color="#8B4A68"/>
      <stop offset="100%" stop-color="#B85C2A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="60"  cy="60"  r="120" fill="#FFD4B8" opacity=".27"/>
  <circle cx="460" cy="460" r="100" fill="#F4C2D0" opacity=".30"/>
  <circle cx="452" cy="70"  r="72" fill="#B2E4D4" opacity=".24"/>
  <circle cx="70"  cy="452" r="58" fill="#B8D8F0" opacity=".22"/>
  <g transform="translate(256 256) scale(.72) translate(-256 -250)">
    <ellipse cx="256" cy="143" rx="22" ry="40" fill="#F4C2D0" opacity=".70"/>
    <ellipse cx="256" cy="257" rx="22" ry="40" fill="#F4C2D0" opacity=".70"/>
    <ellipse cx="199" cy="200" rx="40" ry="22" fill="#B2E4D4" opacity=".70"/>
    <ellipse cx="313" cy="200" rx="40" ry="22" fill="#B2E4D4" opacity=".70"/>
    <ellipse cx="216" cy="157" rx="21" ry="37" fill="#FFD4B8" opacity=".62" transform="rotate(-45 216 157)"/>
    <ellipse cx="296" cy="243" rx="21" ry="37" fill="#FFD4B8" opacity=".62" transform="rotate(-45 296 243)"/>
    <ellipse cx="296" cy="157" rx="21" ry="37" fill="#B8D8F0" opacity=".62" transform="rotate(45 296 157)"/>
    <ellipse cx="216" cy="243" rx="21" ry="37" fill="#B8D8F0" opacity=".62" transform="rotate(45 216 243)"/>
    <circle cx="256" cy="200" r="28" fill="url(#gr)" opacity=".92"/>
    <text x="256" y="350" font-family="Georgia,'Times New Roman',serif" font-style="italic"
          font-size="90" fill="url(#gr)" text-anchor="middle" letter-spacing="-2">bloom</text>
    <line x1="186" y1="368" x2="326" y2="368" stroke="#C0607A" stroke-width="1.2" opacity=".35"/>
    <text x="256" y="394" font-family="Arial,Helvetica,sans-serif" font-size="22"
          fill="#A07060" text-anchor="middle" letter-spacing="6" font-weight="700">PLANNER</text>
  </g>
</svg>
